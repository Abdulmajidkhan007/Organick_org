<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen flex items-center justify-center px-4">

  <form class="max-w-4xl w-full bg-white shadow-md rounded-lg p-8 border border-gray-200 space-y-6">
    <div class="grid md:grid-cols-2 gap-6">
      <!-- Full Name -->
      <div>
        <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Full Name*</label>
        <input type="text" id="fullName" placeholder="Your Email Address"
          class="w-full border border-green-200 rounded-md px-3 py-2 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-green-400" />
      </div>

      <!-- Your Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Your Email*</label>
        <input type="email" id="email" placeholder="example@yourmail.com"
          class="w-full border border-green-200 rounded-md px-3 py-2 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-green-400" />
      </div>
    </div>

    <div class="grid md:grid-cols-2 gap-6">
      <!-- Company -->
      <div>
        <label for="company" class="block text-sm font-medium text-gray-700 mb-1">Company*</label>
        <input type="text" id="company" placeholder="yourcompany name here"
          class="w-full border border-green-200 rounded-md px-3 py-2 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-green-400" />
      </div>

      <!-- Subject -->
      <div>
        <label for="subject" class="block text-sm font-medium text-gray-700 mb-1">Subject*</label>
        <input type="text" id="subject" placeholder="how can we help"
          class="w-full border border-green-200 rounded-md px-3 py-2 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-green-400" />
      </div>
    </div>

    <!-- Message -->
    <div>
      <label for="message" class="block text-sm font-medium text-gray-700 mb-1">Message*</label>
      <textarea id="message" rows="5" placeholder="hello there,i would like to talk about how to..."
        class="w-full border border-green-200 rounded-md px-3 py-2 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-green-400"></textarea>
    </div>

    <!-- Submit Button -->
    <div class="pt-2">
      <button type="submit"
        class="bg-gray-800 hover:bg-gray-700 text-white font-medium px-6 py-2 rounded-md transition-all">
        Send Message
      </button>
    </div>
  </form>

</body>
</html>
